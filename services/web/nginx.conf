# Two front doors, one app.
#   :80   the app. Sign-in by the methods the sign-in service is configured for (Weft accounts and/or
#         Cloudflare Access). Published on WEFT_BIND:WEFT_PORT (see stacks/weft/compose.yaml).
#   :8081 test (published on 127.0.0.1 only). The seeded example.com accounts sign in here.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# The visitor's address for rate limits: Cloudflare's header when the request came through a
# Cloudflare tunnel, otherwise the connecting address.
map $http_cf_connecting_ip $client_ip { default $http_cf_connecting_ip; '' $remote_addr; }
limit_req_zone $client_ip zone=weft_auth:10m rate=20r/m;
# The scheme people used: the tunnel's or proxy's header when there is one (it ends HTTPS), otherwise ours.
map $http_x_forwarded_proto $weft_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://postgrest:3000/; proxy_set_header Host $host; }
  include /etc/nginx/weft-headers.conf;
  location = /auth/mode { proxy_pass http://svc:8080; }
  location /auth/ {
    limit_req zone=weft_auth burst=20 nodelay; limit_req_status 429;
    proxy_pass http://svc:8080; proxy_set_header X-Client-IP $client_ip;
  }
  location /assistant/ { proxy_pass http://assistant:8090; proxy_read_timeout 150s; }
  location /files { client_max_body_size 26m; proxy_request_buffering off; proxy_read_timeout 120s; proxy_pass http://files:8095; }
  location = /collab {
    proxy_pass http://collab:1234; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
  location = /live {
    proxy_pass http://svc:8080; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
  # The connector (MCP + OAuth) for AI apps. /oauth/authorize is the app itself: it signs the person in
  # and shows the consent screen. Everything else under /oauth and the two discovery documents go to mcp.
  location = /oauth/authorize { include /etc/nginx/weft-headers.conf; try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location /oauth/ {
    limit_req zone=weft_auth burst=20 nodelay; limit_req_status 429;
    proxy_pass http://mcp:8097; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $weft_proto;
  }
  location /.well-known/ { return 404; }   # nothing else lives there (not the app's index page)
  location /.well-known/oauth- { proxy_pass http://mcp:8097; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $weft_proto; }
  location = /mcp { client_max_body_size 1m; proxy_pass http://mcp:8097; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $weft_proto; proxy_read_timeout 120s; }
  location /assets/ { include /etc/nginx/weft-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { include /etc/nginx/weft-headers.conf; try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}

server {
  listen 8081;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://postgrest:3000/; proxy_set_header Host $host; }
  include /etc/nginx/weft-headers.conf;
  location = /auth/mode       { proxy_pass http://svc:8081; }
  location = /auth/test-login { proxy_pass http://svc:8081; }
  location /auth/ { return 404; }
  location /assistant/ { proxy_pass http://assistant:8090; proxy_read_timeout 150s; }
  location /files { client_max_body_size 26m; proxy_request_buffering off; proxy_read_timeout 120s; proxy_pass http://files:8095; }
  location = /collab {
    proxy_pass http://collab:1234; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
  location = /live {
    proxy_pass http://svc:8081; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
  # The connector (MCP + OAuth) for AI apps. /oauth/authorize is the app itself: it signs the person in
  # and shows the consent screen. Everything else under /oauth and the two discovery documents go to mcp.
  location = /oauth/authorize { include /etc/nginx/weft-headers.conf; try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location /oauth/ {
    limit_req zone=weft_auth burst=20 nodelay; limit_req_status 429;
    proxy_pass http://mcp:8097; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $weft_proto;
  }
  location /.well-known/ { return 404; }   # nothing else lives there (not the app's index page)
  location /.well-known/oauth- { proxy_pass http://mcp:8097; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $weft_proto; }
  location = /mcp { client_max_body_size 1m; proxy_pass http://mcp:8097; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $weft_proto; proxy_read_timeout 120s; }
  location /assets/ { include /etc/nginx/weft-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { include /etc/nginx/weft-headers.conf; try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
