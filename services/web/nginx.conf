# Two front doors, one app.
#   :80   public (the Weft server 3010: LAN + the homelab host's tunnel). Sign-in only through Cloudflare Access.
#   :8081 test   (127.0.0.1:3011 only). The seeded test accounts sign in here; never routed out.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://postgrest:3000/; proxy_set_header Host $host; }
  location = /auth/mode    { proxy_pass http://svc:8080; }
  location = /auth/session { proxy_pass http://svc:8080; }
  location /auth/ { return 404; }
  location = /live {
    proxy_pass http://svc:8080; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}

server {
  listen 8081;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://postgrest:3000/; proxy_set_header Host $host; }
  location = /auth/mode       { proxy_pass http://svc:8081; }
  location = /auth/test-login { proxy_pass http://svc:8081; }
  location /auth/ { return 404; }
  location = /live {
    proxy_pass http://svc:8081; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
