# The spreadsheet engine (OnlyOffice Docs) under Weft's own address, at /office/. Mounted into the web
# container's /etc/nginx/weft-extra/ only when the engine runs. The editor is an iframe from this same
# address, so this location allows framing by Weft itself (and nothing else).
location /office/ {
  proxy_pass http://office/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $http_host/office;
  proxy_set_header X-Forwarded-Proto $weft_proto;
  client_max_body_size 100m;
  proxy_read_timeout 300s;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Content-Security-Policy;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
}
# The engine reaches the files service directly on the private network to fetch and save sheets; those
# addresses are never served to the outside, so a token copied from a browser is no use to anyone.
location ~ ^/files/[^/]+/office-(file|save)$ { return 404; }
