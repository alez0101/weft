# Weft shell mockup: static files from ../../mockup, served by nginx.
# Same ports AFFiNE used, so the homelab host's weft.example.org tunnel rule needs no change.
name: weft-mockup
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../mockup:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3010:80"
      - "192.0.2.10:3010:80"
