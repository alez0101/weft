# Weft: Postgres + pgvector, PostgREST, svc (sign-in + live), assistant, collab, and web (nginx + the app).
# Postgres and PostgREST are bound to 127.0.0.1 only. web is the one way in:
#   WEFT_BIND:WEFT_PORT (default 127.0.0.1:3010) the app
#   127.0.0.1:3011                               test sign-in for the seeded example.com accounts
# Settings and secrets come from .env next to this file: copy .env.example, or run tools/make_env.py.
# First start: see the README.
name: weft-core

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: weft_owner
      POSTGRES_PASSWORD: ${OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: weft
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../db:/weft-db:ro
    ports:
      - "127.0.0.1:${WEFT_DB_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft_owner -d weft"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?set in .env}@postgres:5432/weft
      PGRST_DB_SCHEMAS: weft
      PGRST_DB_ANON_ROLE: weft_anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?set in .env}
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:${WEFT_API_PORT:-3100}:3000"

  svc:
    build: ../../services/svc
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL_AUTH: postgres://weft_auth:${AUTH_SVC_PASSWORD:?}@postgres:5432/weft
      DATABASE_URL_NOTIFY: postgres://weft_notify:${NOTIFY_SVC_PASSWORD:?}@postgres:5432/weft
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_TTL: "900"
      AUTH_METHODS: ${AUTH_METHODS:-password}            # password, cloudflare, or both
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:-}       # only for cloudflare
      ACCESS_AUD: ${ACCESS_AUD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}             # false only for plain http on a LAN address

  assistant:
    build: ../../services/assistant
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL_ASSIST: postgres://weft_assist:${ASSIST_SVC_PASSWORD:?}@postgres:5432/weft
      JWT_SECRET: ${JWT_SECRET}
      ASSIST_MASTER_KEY: ${ASSIST_MASTER_KEY:?}
      POSTGREST_URL: http://postgrest:3000
      EMBED_URL: ${EMBED_URL:-}                         # Ollama for meaning search; empty = keyword search only

  collab:
    build: ../../services/collab
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL_COLLAB: postgres://weft_collab:${COLLAB_SVC_PASSWORD:?}@postgres:5432/weft
      COLLAB_DEBUG: ${COLLAB_DEBUG:-}
      JWT_SECRET: ${JWT_SECRET}

  files:
    build: ../../services/files
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL_FILES: postgres://weft_files:${FILES_SVC_PASSWORD:?set in .env}@postgres:5432/weft
      JWT_SECRET: ${JWT_SECRET}
      FILE_MAX_MB: ${FILE_MAX_MB:-25}

  web:
    build: ../../services/web
    restart: unless-stopped
    depends_on: [postgrest, svc, assistant, collab, files]
    ports:
      - "${WEFT_BIND:-127.0.0.1}:${WEFT_PORT:-3010}:80"     # the app; WEFT_BIND=0.0.0.0 to reach it from the network
      - "127.0.0.1:${WEFT_TEST_PORT:-3011}:8081"          # test sign-in: this machine only, always

volumes:
  pg_data:
