# Weft: Postgres + pgvector, PostgREST, weft-svc (sign-in + live), and web (nginx + the React shell).
# Postgres and PostgREST are bound to 127.0.0.1 only. web is the one way in:
#   3010 on localhost and the LAN IP (the homelab host's tunnel -> weft.example.org, behind Cloudflare Access)
#   3011 on localhost only (test sign-in for the seeded example.com accounts)
# Rebuild from nothing with ../../db/reset.sh
name: weft-core

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: weft_owner
      POSTGRES_PASSWORD: ${OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: weft
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../db:/weft-db:ro
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft_owner -d weft"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?set in .env}@postgres:5432/weft
      PGRST_DB_SCHEMAS: weft
      PGRST_DB_ANON_ROLE: weft_anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?set in .env}
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:3100:3000"

  svc:
    build: ../../services/svc
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL_AUTH: postgres://weft_auth:${AUTH_SVC_PASSWORD:?}@postgres:5432/weft
      DATABASE_URL_NOTIFY: postgres://weft_notify:${NOTIFY_SVC_PASSWORD:?}@postgres:5432/weft
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_TTL: "900"
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?}
      ACCESS_AUD: ${ACCESS_AUD:?}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}

  assistant:
    build: ../../services/assistant
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL_ASSIST: postgres://weft_assist:${ASSIST_SVC_PASSWORD:?}@postgres:5432/weft
      JWT_SECRET: ${JWT_SECRET}
      ASSIST_MASTER_KEY: ${ASSIST_MASTER_KEY:?}
      POSTGREST_URL: http://postgrest:3000

  collab:
    build: ../../services/collab
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL_COLLAB: postgres://weft_collab:${COLLAB_SVC_PASSWORD:?}@postgres:5432/weft
      COLLAB_DEBUG: ${COLLAB_DEBUG:-}
      JWT_SECRET: ${JWT_SECRET}

  web:
    build: ../../services/web
    restart: unless-stopped
    depends_on: [postgrest, svc, assistant, collab]
    ports:
      - "127.0.0.1:3010:80"
      - "192.0.2.10:3010:80"
      - "127.0.0.1:3011:8081"

volumes:
  pg_data:
