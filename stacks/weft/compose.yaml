# Weft Phase 2: the data layer. Postgres + pgvector, PostgREST in front.
# Both bound to 127.0.0.1 only: nothing here is reachable from the LAN or the tunnel yet.
# Rebuild from nothing with ../../db/reset.sh
name: weft-core

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: weft_owner
      POSTGRES_PASSWORD: ${OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: weft
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../db:/weft-db:ro
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft_owner -d weft"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?set in .env}@postgres:5432/weft
      PGRST_DB_SCHEMAS: weft
      PGRST_DB_ANON_ROLE: weft_anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?set in .env}
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  pg_data:
